{% extends "base.html" %}
{% block title %}Add delivery address — DrinkShop{% endblock %}

{% block content %}
<div class="container">
    <div class="page-head">
        <span class="eyebrow">Account</span>
        <h1>Add a delivery address</h1>
    </div>

    <div class="form-card">
        <div class="location-btn-row">
            <button type="button" id="use-location-btn" class="btn btn-outline btn-small">
                <svg style="width:15px;height:15px"><use href="#icon-pin"/></svg>
                Use my current location
            </button>
        </div>
        <p id="location-status" class="muted"></p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <label>Label (e.g. Home, Office)<input type="text" name="label" value="Home"></label>
            <label>Full name<input type="text" name="full_name" required></label>
            <label>Phone number (for M-Pesa & the rider to call you)<input type="text" name="phone_number" placeholder="07XXXXXXXX" required></label>
            <label>Building / apartment name<input type="text" name="building_name" required></label>
            <label>Apartment / house number<input type="text" name="apartment_number"></label>
            <label>Floor<input type="text" name="floor"></label>
            <label>Street<input type="text" name="street" required></label>
            <label>Area / estate<input type="text" name="area" required></label>
            <label>City<input type="text" name="city" value="Nairobi"></label>
            <label>Delivery notes (gate code, landmark, etc.)<textarea name="delivery_notes"></textarea></label>
            <label class="checkbox-label"><input type="checkbox" name="is_default"> Set as default address</label>

            <input type="hidden" id="id_latitude" name="latitude">
            <input type="hidden" id="id_longitude" name="longitude">

            <button type="submit" class="btn">Save address</button>
        </form>
    </div>
</div>

<script>
    const btn = document.getElementById('use-location-btn');
    const status = document.getElementById('location-status');
    btn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            status.textContent = 'Your browser does not support GPS location.';
            return;
        }
        status.textContent = 'Getting your location…';
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('id_latitude').value = position.coords.latitude;
                document.getElementById('id_longitude').value = position.coords.longitude;
                status.textContent = `Location captured (accuracy ~${Math.round(position.coords.accuracy)}m). This helps our rider find you faster.`;
            },
            (error) => {
                status.textContent = 'Could not get your location — you can still fill the form in manually. (' + error.message + ')';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    });
</script>
{% endblock %}
